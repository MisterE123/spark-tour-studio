name: Build 3DGS Perspectives Studio

on:
  push:
    branches: [main, 'codex/experimental-*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows x64 checks and package
    runs-on: windows-2025
    # Native/browser checks now exceed the former one-hour budget. Keep the
    # complete suite and its individual assertions/timeouts enabled.
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match package.json version' }
      - name: Set up pinned Rust compiler
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.1-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_HOME=$(Join-Path $env:USERPROFILE '.cargo')" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$(Join-Path $env:USERPROFILE '.rustup')" >> $env:GITHUB_ENV
      - name: Build Spark Rust converter from verified source
        run: npm run build:converter
      - name: Run unit and integration tests
        run: npm test
      - name: Build local web runtime and license notices
        run: npm run build
      - name: Bundle verified GitHub sign-in tool
        run: npm run bundle:github
      - name: Check offline collision selection and enclosure meshing
        run: node scripts/collision-engine-check.mjs
      - name: Check streamed navigable collision generation
        run: node scripts/paged-collision-engine-check.mjs
      - name: Build Windows tour launcher
        run: npm run launcher
      - name: Package editor for native checks
        run: npx electron-builder --win --x64 --dir
      - name: Check packaged authoring and exported viewer
        run: node scripts/scene-navigation-check.mjs
      - name: Check collision selection authoring and saved GLBs
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/collision-editor-check.mjs
      - name: Check paged collision authoring, navigation bake and portable export
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/paged-collision-editor-check.mjs
      - name: Check live GLB and paged collision replacement after navigation errors
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/collider-replacement-check.mjs
      - name: Check full-detail collision readiness and streamed walking seams
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/paged-collision-runtime-check.mjs
      - name: Check fine collision detail in large pages with bounded local physics
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/local-collision-runtime-check.mjs
      - name: Check whole-scene collision guides and bounded nearby detail
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/collision-overview-check.mjs
      - name: Check configurable coarse steps, scene scale and correct-floor walking
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/walking-step-runtime-check.mjs
      - name: Check smooth walking camera and stable voxel contacts at different refresh rates
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/walking-camera-runtime-check.mjs
      - name: Check saved paged routes and local stepping fallback with a real worker
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/legacy-step-runtime-check.mjs
      - name: Check certified empty collision branches without loading their leaves
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/air-summary-runtime-check.mjs
      - name: Check view geometry, camera updates, box walls and walking acceleration
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/authoring-movement-check.mjs --compact
      - name: Check offline click-to-walk through narrow passages
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/narrow-walk-check.mjs
      - name: Check bubble settings and captured movement
        run: node scripts/bubble-settings-check.mjs
      - name: Check deliberate mouse capture and consistent navigation keys
        run: node scripts/navigation-controls-check.mjs
      - name: Check walking keyboard aliases and mobile controls
        run: node scripts/walk-controls-check.mjs
      - name: Check visitor onboarding and saved glass appearance
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/viewer-onboarding-check.mjs
      - name: Check bubble ray picking and streamed occlusion
        run: node scripts/bubble-runtime-check.mjs
      - name: Check constrained viewpoint VR comfort and disabled-view entries
        run: node scripts/viewpoint-xr-comfort-check.mjs
      - name: Check partial collision failure and same-session recovery
        run: node scripts/collision-recovery-check.mjs
      - name: Check responsive canceled VR targeting and shared collision support
        run: node scripts/teleport-cancellation-check.mjs
      - name: Check responsive stereo XR frames during wall-grazing teleport
        run: node scripts/xr-teleport-liveness-check.mjs
      - name: Check tracked controller hover and safe pose-loss recovery
        run: node scripts/xr-controller-tracking-check.mjs
      - name: Check optional automatic detail and immutable authored presets
        run: node scripts/adaptive-detail-check.mjs
      - name: Check authored entry paging and first-frame loading presentation
        run: node scripts/startup-presentation-check.mjs
      - name: Check concurrent panorama loading and stale-image cancellation
        run: node scripts/panorama-loading-check.mjs
      - name: Check responsive title paint and retryable local runtime warm-up
        run: node scripts/runtime-warmup-check.mjs
      - name: Check runtime warm-up cancellation and one renderer lifecycle
        run: node scripts/stage-lifecycle-check.mjs
      - name: Check deferred physics, offline chunks and same-session retry
        run: node scripts/lazy-physics-check.mjs
      - name: Check story keyboard focus and validated local content actions
        run: node scripts/content-dialog-check.mjs
      - name: Check incomplete content stays inert across browser, XR and export
        run: node scripts/content-resource-check.mjs
      - name: Check selection-safe editor actions and in-queue imports
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/editor-workflow-check.mjs
      - name: Check pending image, audio and preset imports survive authoring changes
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/editor-imports-check.mjs
      - name: Check close waits for authorized imports or permits explicit discard
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/editor-close-check.mjs
      - name: Check editing stays safe while the 3D runtime prepares
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/editor-warmup-check.mjs
      - name: Check encoded asset filenames through import, export and reopen
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/asset-filenames-check.mjs
      - name: Check pending native imports retain their project ownership
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/import-ownership-check.mjs
      - name: Check canceling Save As preserves edits, Undo and recovery
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/editor-save-cancel-check.mjs
      - name: Check rich text histories stay with their story and imported images
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/richtext-history-check.mjs
      - name: Check editor focus stops held movement without breaking controls
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/input-focus-check.mjs
      - name: Check title, editor and XR audio lifecycle and mute state
        run: node scripts/audio-lifecycle-check.mjs
      - name: Check exported viewer audio stays silent behind its landing page
        run: node scripts/audio-export-check.mjs
      - name: Check portable HTML resource completeness and ordinary links
        run: node scripts/portable-resources-check.mjs
      - name: Check remote RAD companion bytes load offline in Spark
        run: node scripts/remote-rad-export-check.mjs
      - name: Check Studio build identity stays out of exported viewer dependencies
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/studio-build-check.mjs
      - name: Check compact portrait and landscape touch viewer
        run: node scripts/mobile-viewer-check.mjs
      - name: Check precision reloads and persistent XR tracking
        run: node scripts/extended-precision-check.mjs
      - name: Check cold network settings and shared HTTPS precision
        run: node scripts/network-performance-check.mjs
      - name: Check local tour history and hosting warnings
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/git-editor-check.mjs
      - name: Check GitHub connection, pushes and Pages publishing
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/github-editor-check.mjs
      - name: Check cached walking routes and storage fallback
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/navigation-cache-check.mjs
      - name: Check editor panels, rich content and portable export
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/ui-polish-check.mjs
      - name: Check author branding, browser metadata and optional studio credit
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/branding-check.mjs
      - name: Check website drafts survive autosave and reject invalid publication
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/branding-drafts-check.mjs
      - name: Check visible WebGL-unavailable guidance on desktop and mobile
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/viewer-webgl-check.mjs
      - name: Check saved performance settings and exported precision
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/performance-persistence-check.mjs
      - name: Check tour directory, scene loading and distribution help
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/tour-directory-check.mjs
      - name: Check hemisphere colors, horizon blend and background cleanup
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/hemisphere-background-check.mjs
      - name: Check live alignment and XR content/navigation polish
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/xr-polish-check.mjs
      - name: Check real stereo head collision, scale and tracking recovery
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/xr-head-collision-check.mjs
      - name: Check streamed precision and queued scene replacement
        env:
          SPARK_PACKAGED: '1'
        run: node scripts/advanced-import-check.mjs
      - name: Build portable Windows editor
        if: github.event_name != 'pull_request'
        run: npx electron-builder --prepackaged release/win-unpacked --win portable --x64
      - name: Prepare downloadable builds and checksums
        if: github.event_name != 'pull_request'
        run: node scripts/build-artifacts.mjs
      - name: Upload builds
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: 3DGS-Perspectives-Studio-windows-x64-${{ github.sha }}
          path: artifacts/*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7
  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified build assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name 3DGS-Perspectives-Studio-windows-x64-${{ github.sha }} --dir artifacts
          if ($LASTEXITCODE -ne 0) {
            gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name spark-tour-studio-windows-x64-${{ github.sha }} --dir artifacts
          }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download tested build assets' }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Array wrapping matters when the artifact contains one ZIP: splatting a
          # scalar string would pass each filename character as a separate argument.
          $files = @(Get-ChildItem -LiteralPath artifacts -File -Filter '*-windows-x64.zip' | ForEach-Object FullName)
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows release ZIP' }
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title "3DGS Perspectives Studio $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
