name: Publish tested release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v1.9.3
        required: true
        type: string
      run_id:
        description: Build run ID with a successful Windows packaging job
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify build and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
        run: ./scripts/publish-release.ps1
